# Linux equivalent of ThrottleStop profile 1: Performance
# Source values decoded from the supplied ThrottleStop.ini.
# Core:      -135.74 mV
# CPU Cache: -135.74 mV
# PL2/short: 55 W
# PL1/long:  45 W
#
# iGPU Unslice was also -135.74 mV in ThrottleStop, but intel-undervolt
# does not expose that sixth ThrottleStop voltage plane, so it is omitted.

enable no

undervolt 0 'CPU' -135.74
undervolt 1 'GPU' 0
undervolt 2 'CPU Cache' -135.74
undervolt 3 'System Agent' 0
undervolt 4 'Analog I/O' 0

# Syntax: power package <short-term/PL2> <long-term/PL1>
power package 55 45

interval 5000
daemon undervolt:once
daemon power
